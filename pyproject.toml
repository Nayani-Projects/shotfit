[project]
name = "shotfit"
version = "0.1.0"
description = "Public-data NBA shooting translation decision brief"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "altair>=5.5",
  "duckdb>=1.3",
  "joblib>=1.5",
  "nba-api>=1.11.4",
  "numpy>=2.1",
  "pandas>=2.2",
  "pyarrow>=19",
  "plotly>=6.0",
  "scikit-learn>=1.6",
  "streamlit>=1.45",
  "xgboost>=3.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shotfit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
